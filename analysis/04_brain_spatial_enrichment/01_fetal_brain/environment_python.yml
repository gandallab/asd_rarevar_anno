name: scdrs-sop
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.16
  - pip
  - pip:
      - scdrs==1.0.2
      - scanpy==1.11.5
      - anndata==0.12.19
      - numpy==1.26.4
      - scipy==1.12.0
      - pandas==2.3.3
      - matplotlib==3.11.1
      - statsmodels==0.15.0
      - numba==0.67.0
      - h5py==3.16.0
      - pyarrow==25.0.0
      - scikit-learn==1.9.0
      - fire==0.7.1

# captured on macOS-26.6.2-arm64-arm-64bit (arm64)
# numpy is held below 2 and scipy below 1.13: scDRS 1.0.2 relies on numpy
# aliases and scipy interfaces that later releases removed.
