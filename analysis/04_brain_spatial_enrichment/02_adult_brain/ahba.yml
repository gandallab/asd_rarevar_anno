# Conda environment for the AHBA download/build step (notebook 01) and the
# deprecated hand-rolled spin notebook (DEPR_old_spin_test.ipynb), both of which
# use abagen. abagen 0.1.3 predates the numpy 2 / pandas 2 / setuptools 81
# breaking changes, so those are pinned back (numpy<2, pandas<2, setuptools<81;
# pandas<2 also matches the set_axis(inplace=) shim in the notebook).
#
# Create it (from this directory) with:
#     conda env create -f ahba.yml        # or: mamba env create -f ahba.yml
#     conda activate ahba
# Register it as a Jupyter kernel (so notebook 01 finds "Python (ahba)"):
#     python -m ipykernel install --user --name ahba --display-name "Python (ahba)"
#
# First run of notebook 01 downloads ~4 GB of AHBA microarray via abagen.
# Pins are to the MINOR version (=x.y) so any patch the channel carries will do;
# the numpy<2 / pandas<2 / setuptools<81 caps are the ones that matter for abagen.
# If a managed/mirrored conda-forge lacks even a minor version, drop that pin and
# tell me which one.
name: ahba
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26
  - pandas=1.5
  - scipy=1.15
  - scikit-learn=1.7
  - statsmodels=0.14
  - nibabel=5.4
  - nilearn=0.10
  - matplotlib=3.10
  - setuptools<81
  - ipykernel
  - pip
  - pip:
      - abagen==0.1.3
