# Conda environment for the spin-test / enrichment step (notebooks 02, 03 and
# run_spin_test.py / the SLURM array). Neuromaps-based cornblath spin test.
#
# Create it (from this directory) with:
#     conda env create -f spin.yml        # or: mamba env create -f spin.yml
#     conda activate spin
# Register it as a Jupyter kernel (so notebooks 02/03 find "Python (spin)"):
#     python -m ipykernel install --user --name spin --display-name "Python (spin)"
#
# Pins are to the MINOR version (=x.y) so any patch the channel carries will do.
# If a managed/mirrored conda-forge is missing even a minor version, drop that
# package's pin entirely (let conda resolve it) and tell me which one.
# Note: we use the native 164k surface density, so Connectome Workbench
# (wb_command) is NOT required.
name: spin
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=2.2
  - pandas=2.3
  - scipy=1.15
  - scikit-learn=1.7
  - statsmodels=0.14
  - nibabel=5.4
  - nilearn=0.14
  - matplotlib=3.10
  - ipykernel
  - pip
  - pip:
      - neuromaps==0.0.7
